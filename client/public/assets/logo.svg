<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="goldRich" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFE07A"/>
      <stop offset="35%" stop-color="#E8C97A"/>
      <stop offset="70%" stop-color="#A07830"/>
      <stop offset="100%" stop-color="#6B4A14"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <radialGradient id="darkPlate" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#241830"/>
      <stop offset="60%" stop-color="#0E0820"/>
      <stop offset="100%" stop-color="#040108"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE07A" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFE07A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFE07A" stop-opacity="0"/>
    </radialGradient>
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ═════════ HALO + EMBLEM (the icon) ═════════ -->
  <circle cx="160" cy="138" r="120" fill="url(#halo)"/>

  <g filter="url(#emblemShadow)">
    <!-- Outer gold rim -->
    <circle cx="160" cy="138" r="100" fill="url(#darkPlate)" stroke="url(#goldRich)" stroke-width="5"/>
    <!-- Inner gold ring -->
    <circle cx="160" cy="138" r="92" fill="none" stroke="url(#goldLight)" stroke-width="1" opacity="0.6"/>

    <!-- Decorative outer pattern — 8 tiny diamonds around the rim -->
    <g fill="url(#goldRich)" opacity="0.85">
      <g transform="translate(160 38)">
        <path d="M0,-5 L3,0 L0,5 L-3,0 Z"/>
      </g>
      <g transform="translate(160 238)">
        <path d="M0,-5 L3,0 L0,5 L-3,0 Z"/>
      </g>
      <g transform="translate(60 138)">
        <path d="M0,-5 L3,0 L0,5 L-3,0 Z"/>
      </g>
      <g transform="translate(260 138)">
        <path d="M0,-5 L3,0 L0,5 L-3,0 Z"/>
      </g>
      <g transform="translate(89 67) rotate(45)">
        <path d="M0,-3.5 L2,0 L0,3.5 L-2,0 Z"/>
      </g>
      <g transform="translate(231 67) rotate(45)">
        <path d="M0,-3.5 L2,0 L0,3.5 L-2,0 Z"/>
      </g>
      <g transform="translate(89 209) rotate(45)">
        <path d="M0,-3.5 L2,0 L0,3.5 L-2,0 Z"/>
      </g>
      <g transform="translate(231 209) rotate(45)">
        <path d="M0,-3.5 L2,0 L0,3.5 L-2,0 Z"/>
      </g>
    </g>

    <!-- 8-point star background watermark (Arabic geometric motif) -->
    <g transform="translate(160 138)" opacity="0.10">
      <path d="M0,-78 L20,-20 L78,0 L20,20 L0,78 L-20,20 L-78,0 L-20,-20 Z"
        fill="none" stroke="#FFE07A" stroke-width="2"/>
      <path d="M0,-78 L20,-20 L78,0 L20,20 L0,78 L-20,20 L-78,0 L-20,-20 Z"
        fill="none" stroke="#FFE07A" stroke-width="2" transform="rotate(45)"/>
    </g>

    <!-- ── UAE flag mini-banner across the top ──
         Authentic layout: red hoist (left 1/4) + green/white/black stripes -->
    <g transform="translate(110 64)">
      <clipPath id="flagClip">
        <rect x="0" y="0" width="100" height="22" rx="3"/>
      </clipPath>
      <g clip-path="url(#flagClip)">
        <rect x="0" y="0" width="25" height="22" fill="#EF3340"/>
        <rect x="25" y="0" width="75" height="7.33" fill="#009639"/>
        <rect x="25" y="7.33" width="75" height="7.34" fill="#FFFFFF"/>
        <rect x="25" y="14.67" width="75" height="7.33" fill="#1A1A1A"/>
      </g>
      <rect x="0" y="0" width="100" height="22" rx="3" fill="none" stroke="url(#goldRich)" stroke-width="1.2"/>
    </g>

    <!-- ── PLAYING CARD silhouette inside ── -->
    <g transform="translate(160 162)">
      <!-- Main card -->
      <rect x="-46" y="-50" width="92" height="100" rx="9" fill="#0A0418" stroke="url(#goldRich)" stroke-width="2.5"/>
      <rect x="-42" y="-46" width="84" height="92" rx="6" fill="none" stroke="#E8C97A" stroke-width="0.6" opacity="0.5"/>

      <!-- Big ornate "C" — stylised so the gap forms a checkmark -->
      <g transform="translate(0 0)">
        <!-- Glow under "C" -->
        <path d="M 22 -28
                 A 32 32 0 1 0 22 28
                 L 14 18
                 A 22 22 0 1 1 14 -18 Z"
          fill="url(#goldRich)" opacity="0.18"/>
        <!-- Main "C" stroke — forms a thick gold crescent -->
        <path d="M 22 -28
                 A 32 32 0 1 0 22 28
                 L 14 18
                 A 22 22 0 1 1 14 -18 Z"
          fill="url(#goldRich)" stroke="url(#goldLight)" stroke-width="1.5"/>
        <!-- Highlight along the inner curve -->
        <path d="M 14 -18 A 22 22 0 0 0 14 18"
          fill="none" stroke="#FFE07A" stroke-width="1.8" opacity="0.85"/>
      </g>

      <!-- Checkmark sweeping across the C -->
      <g transform="translate(0 4)">
        <path d="M -16 0 L -2 14 L 24 -14"
          fill="none" stroke="#FFE07A" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"
          opacity="0.95"/>
        <path d="M -16 0 L -2 14 L 24 -14"
          fill="none" stroke="#FFFFFF" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"
          opacity="0.55"/>
      </g>

      <!-- Small palm tree at bottom -->
      <g transform="translate(0 38)" fill="url(#goldRich)" opacity="0.85">
        <rect x="-0.6" y="0" width="1.2" height="6"/>
        <path d="M0,0 Q-7,-3 -10,2 Q-4,-1 0,1 Z"/>
        <path d="M0,0 Q7,-3 10,2 Q4,-1 0,1 Z"/>
        <path d="M0,-2 Q-4,-7 -1,-9 Q1,-7 0,-2 Z"/>
        <path d="M0,-2 Q4,-7 1,-9 Q-1,-7 0,-2 Z"/>
      </g>
    </g>
  </g>

  <!-- ═════════ WORDMARK below ═════════ -->
  <g>
    <!-- "CHECK" — bold serif gold -->
    <text x="160" y="282" text-anchor="middle"
      font-family="Cinzel, Georgia, serif"
      font-size="34" font-weight="900"
      fill="url(#goldRich)" letter-spacing="10"
      style="paint-order: stroke; stroke: #6B4A14; stroke-width: 0.8;">CHECK</text>

    <!-- Decorative side dashes flanking the wordmark -->
    <g stroke="url(#goldLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
      <line x1="32" y1="278" x2="64" y2="278"/>
      <line x1="256" y1="278" x2="288" y2="278"/>
      <circle cx="28" cy="278" r="2.5" fill="url(#goldRich)" stroke="none"/>
      <circle cx="292" cy="278" r="2.5" fill="url(#goldRich)" stroke="none"/>
    </g>

    <!-- Arabic name "شيك" -->
    <text x="160" y="305" text-anchor="middle"
      font-family="Scheherazade New, Cairo, serif"
      font-size="18" font-weight="700"
      fill="#E8C97A" opacity="0.85" letter-spacing="3">شيك</text>
  </g>
</svg>
