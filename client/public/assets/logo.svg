<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Card body — deep navy / black with subtle gradient -->
    <linearGradient id="cardBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%"  stop-color="#1A1428"/>
      <stop offset="100%" stop-color="#040108"/>
    </linearGradient>
    <!-- Gold gradient for borders + text -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFE07A"/>
      <stop offset="50%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#FFE07A"/>
      <stop offset="100%" stop-color="#6B4A14"/>
    </linearGradient>
    <!-- Soft halo behind the card -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE07A" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFE07A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFE07A" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Outer halo -->
  <circle cx="128" cy="128" r="120" fill="url(#halo)"/>

  <!-- Main card -->
  <g filter="url(#cardShadow)">
    <!-- Outer gold frame -->
    <rect x="40" y="20" width="176" height="216" rx="18" fill="url(#cardBody)" stroke="url(#goldDeep)" stroke-width="4"/>
    <!-- Inner gold border (filigree) -->
    <rect x="50" y="30" width="156" height="196" rx="12" fill="none" stroke="#E8C97A" stroke-width="1" opacity="0.55"/>

    <!-- ── UAE FLAG strip at the top ──
         Authentic layout: vertical RED bar on the hoist side (1/4 width),
         then GREEN/WHITE/BLACK horizontal stripes on the rest. -->
    <g transform="translate(74 44)">
      <!-- Whole flag area: 108 wide × 46 tall, with rounded corners -->
      <clipPath id="flagClip">
        <rect x="0" y="0" width="108" height="46" rx="4"/>
      </clipPath>
      <g clip-path="url(#flagClip)">
        <!-- Red hoist (left 1/4) -->
        <rect x="0" y="0" width="27" height="46" fill="#EF3340"/>
        <!-- Green top stripe (right 3/4) -->
        <rect x="27" y="0" width="81" height="15.33" fill="#009639"/>
        <!-- White middle -->
        <rect x="27" y="15.33" width="81" height="15.34" fill="#FFFFFF"/>
        <!-- Black bottom -->
        <rect x="27" y="30.67" width="81" height="15.33" fill="#1A1A1A"/>
      </g>
      <!-- Gold trim around the flag -->
      <rect x="0" y="0" width="108" height="46" rx="4" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    </g>

    <!-- ── BIG CHECKMARK in the centre — heart of the brand ── -->
    <g transform="translate(128 130)">
      <!-- Glow underlay -->
      <path d="M -42 4 L -14 30 L 42 -28"
        fill="none" stroke="#FFE07A" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
      <!-- Main thick stroke -->
      <path d="M -42 4 L -14 30 L 42 -28"
        fill="none" stroke="url(#gold)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Top highlight -->
      <path d="M -42 4 L -14 30 L 42 -28"
        fill="none" stroke="#FFE07A" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </g>

    <!-- ── CHECK wordmark — bold serif under the checkmark ── -->
    <text x="128" y="190" text-anchor="middle"
      font-family="Cinzel, Georgia, serif"
      font-size="26" font-weight="900"
      fill="url(#gold)" letter-spacing="6">CHECK</text>

    <!-- ── Arabic name ── -->
    <text x="128" y="210" text-anchor="middle"
      font-family="Scheherazade New, Cairo, serif"
      font-size="14" font-weight="700"
      fill="#E8C97A" opacity="0.85" letter-spacing="2">شيك</text>

    <!-- Decorative corner ornaments — Arabic-style filigree -->
    <g fill="none" stroke="#E8C97A" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
      <path d="M58 38 Q58 32 64 32"/>
      <path d="M198 38 Q198 32 192 32"/>
      <path d="M58 218 Q58 224 64 224"/>
      <path d="M198 218 Q198 224 192 224"/>
    </g>

    <!-- Tiny crescent + 8-point star on the bottom centre — Arabic motif -->
    <g transform="translate(128 222)">
      <path d="M-4,0 A4,4 0 1,0 -1,3 A3,3 0 1,1 -4,0 Z" fill="#E8C97A" opacity="0.55"/>
      <g transform="translate(8 0)">
        <path d="M0,-3 L0.8,-0.8 L3,0 L0.8,0.8 L0,3 L-0.8,0.8 L-3,0 L-0.8,-0.8 Z"
          fill="#E8C97A" opacity="0.55"/>
      </g>
    </g>
  </g>
</svg>
